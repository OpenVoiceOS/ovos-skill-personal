[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ovos-skill-personal"
dynamic = ["version"]
description = "OVOS personal skill plugin"
readme = "README.md"
license = {text = "Apache-2.0"}
authors = [
    {name = "JarbasAi", email = "jarbasai@mailfence.com"}
]
keywords = ["ovos", "skill", "plugin"]
dependencies = [
    "ovos-utils>=0.0.38",
    "ovos-workshop>=0.0.15,<10.0.0"
]

[project.optional-dependencies]
test = [
    "pytest",
    "pytest-timeout",
    "ovoscope>=1.6.9a1,<2.0.0",
    "ovos-bus-client",
    "ovos-core[plugins]>=2.0.0a1",
    "ovos-padatious>=2.0.5a1"
]

[project.urls]
Homepage = "https://github.com/OpenVoiceOS/ovos-skill-personal"

[project.entry-points."opm.skill"]
"ovos-skill-personal.openvoiceos" = "ovos_skill_personal:PersonalSkill"

[tool.setuptools]
packages = ["ovos_skill_personal"]

[tool.setuptools.package-dir]
ovos_skill_personal = ""

[tool.setuptools.dynamic]
version = {attr = "ovos_skill_personal.version.__version__"}

[tool.setuptools.package-data]
ovos_skill_personal = [
    "*.json",
    "locale/**/*",
    "locale/*/*.voc",
    "locale/*/*.intent",
    "locale/*/*.dialog",
    "res/**/*",
]
