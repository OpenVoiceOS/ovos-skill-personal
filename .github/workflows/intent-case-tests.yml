name: Intent-Case Tests

on:
  pull_request:
    branches: [dev, master, main]
  workflow_dispatch:

jobs:
  intent_case_tests:
    uses: OpenVoiceOS/gh-automations/.github/workflows/intent-case-tests.yml@dev
    secrets: inherit
    with:
      python_version: '3.11'
      install_extras: 'test'
      test_path: 'test/end2end/test_intents.py'
      pre_release: true
      require_padatious: true
      require_m2v: true
      # One matrix job per locale shipped under test/end2end/cases/. The
      # ~2,500 generated cases hit the 6h GH-hosted runner limit in a
      # single job; sharding by lang gets each shard to a few hundred.
      langs: '["ca-ES","da-DK","de-DE","en-US","es-ES","eu-ES","fr-FR","gl-ES","hu-HU","it-IT","nl-NL","pt-BR","pt-PT","ru-RU","sv-SE"]'
