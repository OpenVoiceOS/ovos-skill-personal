name: Skill End-to-End Tests (ovoscope)

on:
  pull_request:
    branches: [dev, master, main]
  workflow_dispatch:

jobs:
  ovoscope:
    uses: OpenVoiceOS/gh-automations/.github/workflows/ovoscope.yml@dev
    secrets: inherit
    with:
      python_version: '3.11'
      install_extras: 'test'
      test_path: 'test/end2end/'
      # Install ovoscope + pipeline plugins from their `dev` branches so the
      # new intent-case helper (TigreGotico/ovoscope#58) is available before
      # it lands on PyPI. Drop this once an ovoscope release ships.
      pre_release: true
      require_padatious: true
      require_m2v: true
      # Shard by language — one matrix job per locale. Without this, the
      # ~2,500 generated intent-case tests hit the 6h GH-hosted runner limit
      # in a single job. Must match the locale folders under test/end2end/cases/.
      # Note: TestPipelineDivergence canaries have no lang slug in their
      # nodeid; they currently only run if the "all" entry is present.
      langs: '["ca-ES","da-DK","de-DE","en-US","es-ES","eu-ES","fr-FR","gl-ES","hu-HU","it-IT","nl-NL","pt-BR","pt-PT","ru-RU","sv-SE"]'
