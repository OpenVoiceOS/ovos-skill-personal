[pytest]
# Intent-case tests are tolerant by default: individual misroutes don't
# fail CI, but the aggregate accuracy report is always emitted and the
# session blocks if overall accuracy drops below the threshold.
#
# The threshold is intentionally lenient until the pipelines stabilise;
# tighten as routing reliability improves.
addopts =
    --ovoscope-accuracy-tolerant
    --ovoscope-accuracy-report=intent-accuracy.json
    --ovoscope-accuracy-min=0.5
